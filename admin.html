<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FARRELL CLOTHING | Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Urbanist:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <style>
    :root{--aqua:#7ceeff;--blue:#00aeea;--line:rgba(100,180,255,.25);--panel:rgba(255,255,255,.055)}
    body{min-height:100vh;background:#050b14;color:#eaf6ff;font-family:Urbanist,Arial,sans-serif}
    .admin-topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:15px 5%;border-bottom:1px solid var(--line);background:linear-gradient(110deg,#073c70,#061a32 55%,#03070d)}
    .admin-topbar h1{font:26px Anton,sans-serif;letter-spacing:2px;color:var(--aqua);text-shadow:0 0 12px #00bfff}
    .admin-top-actions{display:flex;gap:8px;align-items:center}
    .admin-top-actions button,.primary-btn,.secondary-btn,.danger-btn{border:1px solid var(--line);border-radius:10px;padding:10px 15px;font-weight:800;cursor:pointer}
    .admin-top-actions button,.secondary-btn{background:#102b47;color:#dff8ff}
    .primary-btn{background:linear-gradient(135deg,#a5f5ff,#00aeea);color:#00131c;border:0}
    .danger-btn{background:#4b1821;color:#ffd5da;border-color:#9a3545}
    .admin-wrap{max-width:1250px;margin:auto;padding:24px 18px 70px}
    #admin-login-screen{max-width:390px;margin:9vh auto;padding:28px;border:1px solid var(--line);border-radius:20px;background:var(--panel);text-align:center}
    #admin-login-screen h2{font:26px Anton,sans-serif;color:var(--aqua);letter-spacing:1px;margin-bottom:18px}
    .admin-field{display:flex;flex-direction:column;gap:6px;margin:10px 0;text-align:left}
    .admin-field label{font-size:12px;color:#a9c8df;font-weight:800;letter-spacing:.4px}
    .admin-field input,.admin-field select,.admin-field textarea,.admin-search,.admin-status-select{width:100%;padding:11px 12px;border-radius:10px;border:1px solid #315778;background:#081827;color:#f0fbff;outline:none}
    .admin-field input:focus,.admin-field select:focus,.admin-field textarea:focus,.admin-search:focus{border-color:var(--aqua);box-shadow:0 0 0 2px #7ceeff22}
    .admin-field select option{background:#081827}
    .admin-login-btn{width:100%;margin-top:8px}
    .admin-nav{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 20px}
    .admin-nav button{padding:10px 16px;border:1px solid var(--line);border-radius:30px;background:#0b1b2d;color:#cdeaff;font-weight:800;cursor:pointer}
    .admin-nav button.active{background:var(--aqua);color:#00131c;border-color:var(--aqua)}
    .admin-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin:18px 0}
    .admin-stat,.admin-panel,.admin-order-card,.product-admin-card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px}
    .admin-stat strong{display:block;color:var(--aqua);font-size:27px}.admin-stat span{font-size:11px;letter-spacing:1px;color:#a9c8df;font-weight:800}
    .admin-section-head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin:14px 0}
    .admin-section-head h2{font:23px Anton,sans-serif;color:var(--aqua);letter-spacing:1px}
    .admin-toolbar{display:flex;gap:9px;flex-wrap:wrap;margin:12px 0}
    .admin-toolbar>*{flex:1;min-width:170px}
    .admin-orders-grid,.admin-products-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:12px}
    .admin-order-top{display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
    .admin-order-top h3{color:var(--aqua);font-size:16px;overflow-wrap:anywhere}
    .admin-order-card p,.admin-panel p{font-size:13px;color:#c8dff0;margin:5px 0;overflow-wrap:anywhere}
    .admin-item-line{font-size:12px;color:#9db5c9;padding:5px 0;border-bottom:1px solid #ffffff12}
    .admin-status-select{margin-top:12px}
    .admin-badge{padding:5px 10px;border-radius:30px;font-size:10px;font-weight:900;background:#27394a;color:#d9f4ff}
    .badge-received{background:#55451b;color:#ffe28a}.badge-processing{background:#10445b;color:#7ceeff}.badge-shipped{background:#3c2d64;color:#d1bfff}.badge-delivered{background:#164b37;color:#91ffca}.badge-cancelled{background:#56222a;color:#ffb2bb}
    .product-admin-card{display:grid;grid-template-columns:75px 1fr;gap:12px;align-items:start}
    .product-admin-card img{width:75px;height:85px;object-fit:cover;border-radius:10px;background:#10243a}
    .product-admin-card h3{font-size:14px;color:#eafaff;margin:2px 0 5px}
    .product-admin-card p{font-size:12px;color:#a9c8df;margin:3px 0}
    .product-admin-actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}
    .product-admin-actions button{padding:7px 11px;font-size:12px}
    .admin-form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 14px}
    .admin-form-grid .full{grid-column:1/-1}
    .admin-empty,.admin-message{padding:18px;border:1px dashed var(--line);border-radius:14px;color:#a9c8df;text-align:center}
    .admin-message{margin:12px 0;text-align:left;display:none}
    .admin-message.error{display:block;color:#ffb2bb;border-color:#a43d4a}
    .admin-message.success{display:block;color:#91ffca;border-color:#247b59}
    .sale-status{font-weight:900;color:var(--aqua)}
    .hidden{display:none!important}
    @media(max-width:600px){.admin-topbar{padding:12px 14px}.admin-topbar h1{font-size:20px}.admin-wrap{padding:18px 12px 50px}.admin-form-grid{grid-template-columns:1fr}.admin-form-grid .full{grid-column:auto}}
  </style>
</head>
<body>
  <header class="admin-topbar">
    <h1>FARRELL ADMIN</h1>
    <div class="admin-top-actions">
      <a href="index.html" style="color:#dff8ff;text-decoration:none;font-size:12px;font-weight:800">VIEW STORE</a>
      <button id="admin-logout-btn" class="hidden" onclick="adminLogout()">LOGOUT</button>
    </div>
  </header>

  <section id="admin-login-screen">
    <h2>ADMIN SIGN IN</h2>
    <div class="admin-field"><label>ADMIN EMAIL</label><input type="email" id="admin-email" placeholder="Admin email" autocomplete="username"></div>
    <div class="admin-field"><label>PASSWORD</label><input type="password" id="admin-password" placeholder="Password" autocomplete="current-password"></div>
    <button class="primary-btn admin-login-btn" onclick="adminLogin()">SIGN IN</button>
    <p id="admin-login-error" style="color:#ff9a9a;font-size:12px;margin-top:12px"></p>
  </section>

  <main class="admin-wrap hidden" id="admin-dashboard">
    <div class="admin-stats" id="admin-stats"></div>
    <nav class="admin-nav">
      <button class="active" data-tab="orders" onclick="showAdminTab('orders')">📦 Orders</button>
      <button data-tab="products" onclick="showAdminTab('products')">👕 Products & Stock</button>
      <button data-tab="sale" onclick="showAdminTab('sale')">🔥 Sale Timer</button>
    </nav>

    <section id="tab-orders">
      <div class="admin-section-head"><h2>ORDER MANAGEMENT</h2><button class="secondary-btn" onclick="loadOrders()">↻ Refresh</button></div>
      <div class="admin-toolbar">
        <input class="admin-search" id="order-search" placeholder="Search order ID / customer..." oninput="renderOrders()">
        <select class="admin-search" id="order-filter" onchange="renderOrders()">
          <option value="All">All statuses</option><option>Order Received</option><option>Processing</option><option>Shipped</option><option>Delivered</option><option>Cancelled</option>
        </select>
      </div>
      <div id="admin-orders-list" class="admin-orders-grid"><p class="admin-empty">Loading orders...</p></div>
    </section>

    <section id="tab-products" class="hidden">
      <div class="admin-section-head"><h2>PRODUCTS & INVENTORY</h2><button class="primary-btn" onclick="openProductForm()">＋ Add Product</button></div>
      <div class="admin-toolbar"><input class="admin-search" id="product-search" placeholder="Search products..." oninput="renderProducts()"><select class="admin-search" id="product-filter" onchange="renderProducts()"><option value="All">All products</option><option value="active">Active</option><option value="inactive">Archived</option><option value="low">Low stock (5 or less)</option></select></div>
      <div id="admin-products-list" class="admin-products-grid"><p class="admin-empty">Loading products...</p></div>
    </section>

    <section id="tab-sale" class="hidden">
      <div class="admin-section-head"><h2>FLASH SALE CONTROL</h2></div>
      <div class="admin-panel">
        <p>Set how long the sale countdown should run. The storefront countdown will use this setting for every visitor.</p>
        <p>Current sale: <span class="sale-status" id="sale-current-status">Loading...</span></p>
        <div class="admin-form-grid">
          <div class="admin-field"><label>SALE DURATION (HOURS)</label><input type="number" id="sale-duration" min="0.1" max="720" step="0.1" value="2"></div>
          <div class="admin-field"><label>OR SET EXACT END DATE & TIME</label><input type="datetime-local" id="sale-end-at"></div>
        </div>
        <div class="admin-toolbar">
          <button class="primary-btn" onclick="startSale()">Start / Update Sale</button>
          <button class="danger-btn" onclick="stopSale()">End Sale</button>
        </div>
        <div id="sale-message" class="admin-message"></div>
      </div>
    </section>
  </main>

  <div id="product-modal" class="hidden" style="position:fixed;inset:0;z-index:50;background:#000b;overflow:auto;padding:20px">
    <div class="admin-panel" style="max-width:620px;margin:4vh auto">
      <div class="admin-section-head"><h2 id="product-form-title">ADD PRODUCT</h2><button class="secondary-btn" onclick="closeProductForm()">✕</button></div>
      <form id="product-form" onsubmit="saveProduct(event)">
        <input type="hidden" id="product-id">
        <div class="admin-form-grid">
          <div class="admin-field full"><label>PRODUCT NAME</label><input id="product-name" required maxlength="100"></div>
          <div class="admin-field"><label>PRICE (₱)</label><input id="product-price" type="number" min="0" step="0.01" required></div>
          <div class="admin-field"><label>OLD PRICE (₱) - OPTIONAL</label><input id="product-old-price" type="number" min="0" step="0.01"></div>
          <div class="admin-field"><label>CATEGORY</label><select id="product-category" required><option>Shirts</option><option>Jackets</option><option>Shorts</option><option>Pants</option><option>Accessories</option><option>Other</option></select></div>
          <div class="admin-field"><label>RATING</label><input id="product-rating" type="number" min="0" max="5" step="0.1" value="5"></div>
          <div class="admin-field"><label>STOCK</label><input id="product-stock" type="number" min="0" step="1" value="0" required></div>
          <div class="admin-field full"><label>IMAGE PATH / URL</label><input id="product-image" placeholder="images/item1.png or https://..."></div>
        </div>
        <div id="product-form-message" class="admin-message"></div>
        <div class="admin-toolbar"><button type="submit" class="primary-btn">Save Product</button><button type="button" class="secondary-btn" onclick="closeProductForm()">Cancel</button></div>
      </form>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="admin.js"></script>
</body>
</html>
